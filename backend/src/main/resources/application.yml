server:
  port: ${PORT:8080}

spring:
  application:
    name: hotel-management-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:replace-this-secret-with-a-32-char-minimum-value}
    issuer: hotel-management
    access-token-seconds: ${APP_JWT_ACCESS_TOKEN_SECONDS:28800}
  otp:
    ttl-seconds: ${APP_OTP_TTL_SECONDS:300}
    length: ${APP_OTP_LENGTH:6}
    resend-cooldown-seconds: ${APP_OTP_RESEND_COOLDOWN_SECONDS:60}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@hotelhub.com}
  cors:
    allowed-origins: http://localhost:5173,https://hotel-management-system-five-rouge.vercel.app
  mail:
    mock-mode: ${APP_MAIL_MOCK_MODE:true}
